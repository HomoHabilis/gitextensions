name: Feature Proposal
description: Propose a new feature
labels: 'type: feature request'
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ Review existing issues to see whether someone else has already requested this feature or created a similar issue.
        📖 Please also read [CONTRIBUTING.md](https://github.com/HomoHabilis/gitextensions/blob/master/CONTRIBUTING.md).
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: |
        Think through your proposal and describe it clearly.

        Note that features are only added to the most recent version of Git Extensions.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: Environment
      description: _Help > About_ in Git Extensions shows the Git Extensions and git versions.
      value: |
        - GitExtensions version:
        - GIT version: 
        - OS (Windows / macOS / Linux distribution) and version: 
    validations:
      required: true
