[package]
name = "gitext-app"
description = "Git Extensions - a cross-platform graphical user interface for git (Rust port)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "gitext"
path = "src/main.rs"

[dependencies]
gitext-core.workspace = true
gitext-graph.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
dirs.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
raw-window-handle = "0.6"

[build-dependencies]
# only used when building for Windows
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true
