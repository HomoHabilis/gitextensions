[workspace]
resolver = "2"
members = ["crates/gitext-core", "crates/gitext-graph", "crates/gitext-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/homohabilis/gitextensions"
rust-version = "1.80"

[workspace.dependencies]
gitext-core = { path = "crates/gitext-core" }
gitext-graph = { path = "crates/gitext-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fastrand = "2"
dirs = "5"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "accesskit"] }
egui = "0.29"
egui_extras = "0.29"
rfd = "0.15"

[profile.release]
lto = "thin"
