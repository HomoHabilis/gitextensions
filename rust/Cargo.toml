[workspace]
resolver = "2"
members = ["crates/gitext-core", "crates/gitext-graph", "crates/gitext-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/homohabilis/gitextensions"
rust-version = "1.85"

[workspace.dependencies]
gitext-core = { path = "crates/gitext-core" }
gitext-graph = { path = "crates/gitext-graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
fastrand = "2"
dirs = "5"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11", "accesskit"] }
egui = "0.32"
egui_extras = "0.32"
# pure Rust regexes (no oniguruma C build)
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Linux: Adwaita-style window decorations on Wayland (winit's fallback frame draws the close
# button as a plain square with no cross).
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }

# Guardrails checked by CI (`cargo clippy --workspace --all-targets -- -D warnings`) and by
# agents before they push, see CLAUDE.md at the repository root. Do not weaken them; a local
# exception is an `#[allow(lint, reason = "...")]` on the smallest item that needs it.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# a panic closes the whole window: state the invariant with `expect("...")` or handle the error
# (tests may unwrap and panic, see clippy.toml)
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
# every exception says why
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
# needless copies of strings and shared pointers
implicit_clone = "deny"
inefficient_to_string = "deny"
rc_mutex = "deny"

[profile.release]
lto = "thin"

# egui and the other dependencies are very slow unoptimized: optimize them in debug builds too.
[profile.dev.package."*"]
opt-level = 2
